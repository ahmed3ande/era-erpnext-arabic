name: Validate catalogs

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gettext
          pip install babel
      - name: Validate all translation catalogs
        run: python scripts/check_catalogs.py
      - name: Test translation audit
        run: |
          python -m unittest -v tests/test_audit_translations.py
          python -m unittest -v tests/test_prioritize_review.py
          python -m unittest -v tests/test_apply_review_batch.py
      - name: Verify approved review batches are applied
        run: python scripts/apply_review_batch.py review_batches/accounting-001.csv
      - name: Generate translation audit reports
        run: python scripts/audit_translations.py
      - name: Generate accounting review queue
        run: python scripts/prioritize_review.py --print-limit 50
      - name: Upload translation audit reports
        uses: actions/upload-artifact@v4
        with:
          name: translation-audit
          path: reports/audit/
      - name: Enforce placeholder safety
        run: python scripts/audit_translations.py --fail-on-placeholder
      - name: Lint python
        run: |
          pip install ruff
          ruff check arabic_translations scripts

